name: CI - Lint, Test, Sonar & Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================
  # 1. LINT & TEST
  # ============================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af

      - name: Checkout code
        uses: actions/checkout@v4

      # ========================================================
      # NODE.JS SETUP
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ========================================================
      # AUTH GATEWAY
      # ========================================================
      - name: Install auth-gateway dependencies
        working-directory: services/auth-gateway
        run: npm ci

      - name: Lint auth-gateway
        working-directory: services/auth-gateway
        run: npm run lint --if-present

      - name: Test auth-gateway
        working-directory: services/auth-gateway
        run: npm test --if-present

      - name: Build auth-gateway
        working-directory: services/auth-gateway
        run: npm run build --if-present

      # ========================================================
      # INGESTION
      # ========================================================
      - name: Install ingestion dependencies
        working-directory: services/ingestion
        run: npm ci

      - name: Lint ingestion
        working-directory: services/ingestion
        run: npm run lint --if-present

      - name: Test ingestion
        working-directory: services/ingestion
        run: npm test --if-present

      - name: Build ingestion
        working-directory: services/ingestion
        run: npm run build --if-present

      # ========================================================
      # ISSUES
      # ========================================================
      - name: Install issues dependencies
        working-directory: services/issues
        run: npm ci

      - name: Lint issues
        working-directory: services/issues
        run: npm run lint --if-present

      - name: Test issues
        working-directory: services/issues
        run: npm test --if-present

      - name: Build issues
        working-directory: services/issues
        run: npm run build --if-present

      # ========================================================
      # USERS
      # ========================================================
      - name: Install users dependencies
        working-directory: services/users
        run: npm ci

      - name: Lint users
        working-directory: services/users
        run: npm run lint --if-present

      - name: Test users
        working-directory: services/users
        run: npm test --if-present

      - name: Build users
        working-directory: services/users
        run: npm run build --if-present

      # ========================================================
      # PYTHON
      # ========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        working-directory: services/smartqa-vector-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint smartqa-vector-service
        working-directory: services/smartqa-vector-service
        run: |
          flake8 . \
            --count \
            --max-complexity=10 \
            --statistics || echo "Linter issues found (non-blocking)"

  # ============================================================
  # 2. SONARQUBE
  # ============================================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    # Sonar starts ONLY after lint & test succeeds
    needs: lint-test

    # Only run Sonar on main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=MedEzzedineBenZbiba_smartQA-monoRepo
            -Dsonar.projectName=smartQA-monoRepo
            -Dsonar.organization=medezzedinebenzbiba
            -Dsonar.sources=services/
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/venv/**,**/dist/**,**/.next/**,**/coverage/**,**/package-lock.json,**/build-wrapper-dump.json,**/Dockerfile
            -Dsonar.javascript.lcov.reportPaths=services/**/coverage/lcov.info
            -Dsonar.typescript.lcov.reportPaths=services/**/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=services/**/coverage.xml

  # ============================================================
  # 3. DOCKER BUILD & PUSH
  # ============================================================
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    # Docker starts ONLY after Sonar succeeds
    needs: sonar

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-gateway
          - ingestion
          - issues
          - users
          - smartqa-vector-service

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "IMAGE_BASE_LOWERCASE=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ========================================================
      # VERSIONING (auto-incrementing build number, no git tags)
      # ========================================================
      - name: Determine version
        id: version
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_BASE_LOWERCASE }}/${{ matrix.service }}:latest
            ghcr.io/${{ env.IMAGE_BASE_LOWERCASE }}/${{ matrix.service }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed version
        run: |
          echo "Pushed ${{ matrix.service }} as version ${{ steps.version.outputs.version }}"
