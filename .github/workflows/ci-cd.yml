name: CI - Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Node.js services (NestJS + Next.js) ---
          - service: auth-gateway
            lang: node
          - service: ingestion
            lang: node
          - service: issues
            lang: node
          - service: users
            lang: node
          - service: smart_qa
            lang: node
          # --- Python service (FastAPI) ---
          - service: smartqa-vector-service
            lang: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Node.js steps ----------
      - name: Setup Node.js
        if: matrix.lang == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install Node dependencies
        if: matrix.lang == 'node'
        run: |
          cd services/${{ matrix.service }}
          npm ci

      - name: Run Node linter
        if: matrix.lang == 'node'
        run: |
          cd services/${{ matrix.service }}
          npm run lint --if-present

      - name: Run Node unit tests
        if: matrix.lang == 'node'
        run: |
          cd services/${{ matrix.service }}
          npm test --if-present

      - name: Build Node service
        if: matrix.lang == 'node'
        run: |
          cd services/${{ matrix.service }}
          npm run build --if-present

      # ---------- Python steps ----------
      - name: Setup Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install Python dependencies
        if: matrix.lang == 'python'
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt

      - name: Run Python linter
        if: matrix.lang == 'python'
        run: |
          cd services/${{ matrix.service }}
          pip install flake8
          flake8 . --count --max-complexity=10 --statistics || echo "Linter issues found (non-blocking)"

      - name: Run Python unit tests
        if: matrix.lang == 'python'
        run: |
          cd services/${{ matrix.service }}
          pip install pytest
          pytest || echo "No tests found or tests failed (non-blocking)"

      # ---------- JOB 2: SonarQube Analysis (NEW) ----------
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: lint-test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # All properties are passed as a single string – no quoting issues if we avoid spaces
          args: >
            -Dsonar.projectKey=MedEzzedineBenZbiba_smartQA-monoRepo
            -Dsonar.projectName=smartQA-monoRepo
            -Dsonar.organization=medezzedinebenzbiba
            -Dsonar.sources=services/
            -Dsonar.exclusions=**/node_modules/**,**/*.test.*,**/venv/**,**/dist/**,**/.next/**,**/coverage/**
            -Dsonar.tests=services/
            -Dsonar.javascript.lcov.reportPaths=services/**/coverage/lcov.info
            -Dsonar.python.coverage.reportPaths=services/**/coverage.xml
            -Dsonar.typescript.lcov.reportPaths=services/**/coverage/lcov.info
