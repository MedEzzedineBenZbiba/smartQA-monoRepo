name: CI - Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required for pushing to GitHub Container Registry
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
