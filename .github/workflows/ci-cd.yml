  #           -Dsonar.python.coverage.reportPaths=services/**/coverage.xml
  #           -Dsonar.typescript.lcov.reportPaths=services/**/coverage/lcov.info

  # --------------------------------------------------------------------------
  # Step 4: Docker Build & Push (runs independently on main pushes)
  # --------------------------------------------------------------------------
  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    # No dependency on lint-test or sonar (both commented out)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-gateway
          - ingestion
          - issues
          - users
          - smart_qa
          - smartqa-vector-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
